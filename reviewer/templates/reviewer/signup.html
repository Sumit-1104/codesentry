<!DOCTYPE html>
<html>
<head>
    <title>Sign Up — CodeSentry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #141414; --bg-raised: #1c1c1c; --text: #EDEDED;
            --text-dim: #9A9A9A; --accent: #FF7A45; --border: #2A2A2A;
        }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;
        }
        .box {
            background: var(--bg-raised); border: 1px solid var(--border);
            border-radius: 10px; padding: 40px; width: 320px; text-align: center;
        }
        .brand { display: flex; align-items: baseline; justify-content: center; gap: 10px; margin-bottom: 32px; }
        .dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; }
        h1 { font-size: 18px; margin: 0; }
        input {
            width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 6px;
            border: 1px solid var(--border); background: #0F0F0F; color: var(--text);
            font-family: 'JetBrains Mono', monospace; font-size: 13px;
        }
        input[type="submit"] {
            background: var(--accent); color: #141414; border: none; font-family: 'Inter', sans-serif;
            font-weight: 600; cursor: pointer; margin-top: 8px;
        }
        a { color: var(--accent); font-size: 13px; text-decoration: none; }
        .errorlist { color: #E5484D; font-size: 12px; list-style: none; padding: 0; }
        .helptext { color: var(--text-dim); font-size: 11px; display: block; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="brand"><span class="dot"></span><h1>CodeSentry</h1></div>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Sign Up">
        </form>
        <p style="margin-top: 16px;"><a href="/login/">Already have an account? Login</a></p>
    </div>
</body>
</html>
