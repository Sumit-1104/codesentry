<!DOCTYPE html>
<html>
<head>
    <title>CodeSentry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #141414;
            --bg-raised: #1c1c1c;
            --text: #EDEDED;
            --text-dim: #9A9A9A;
            --accent: #FF7A45;
            --border: #2A2A2A;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 780px;
            margin: 0 auto;
            padding: 60px 24px 100px;
            line-height: 1.5;
        }

        .brand {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
            margin-bottom: 60px;
        }

        .brand-left { display: flex; align-items: baseline; gap: 10px; }
        .dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; display: inline-block; }
        .brand h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }

        .nav-links { display: flex; align-items: center; }
        .nav-links a { color: var(--text); text-decoration: none; font-size: 13px; margin-right: 16px; }
        .nav-links a:hover { color: var(--accent); }
        .logout-btn { background: none; border: none; color: var(--accent); font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer; padding: 0; }

        .welcome h2 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.02em;
        }

        .welcome p {
            color: var(--text-dim);
            font-size: 14px;
            margin: 0 0 40px 0;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .card {
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px 24px;
            text-decoration: none;
            color: var(--text);
            display: block;
            transition: all 0.15s;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .card-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 122, 69, 0.12);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .card-icon svg {
            width: 20px;
            height: 20px;
            color: var(--accent);
        }

        .card h3 {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 6px 0;
        }

        .card p {
            font-size: 13px;
            color: var(--text-dim);
            margin: 0;
        }

        @media (max-width: 600px) {
            .cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="brand">
        <div class="brand-left">
            <span class="dot"></span>
            <h1>CodeSentry</h1>
        </div>
        <div class="nav-links">
            <a href="/history/">History</a>
            <form method="post" action="/logout/" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Logout ({{ request.user.username }})</button>
            </form>
        </div>
    </div>

    <div class="welcome">
        <h2>Welcome back, {{ request.user.username }}</h2>
        <p>{{ total_analyses }} analyses run so far</p>
    </div>

    <div class="cards">
        <a href="/analyze/" class="card">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </div>
            <h3>New Analysis</h3>
            <p>Upload a file, a .zip, or paste a GitHub repo URL to run a fresh AI-powered code review.</p>
        </a>

        <a href="/history/" class="card">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <h3>History</h3>
            <p>Browse and revisit your past code analysis reports anytime.</p>
        </a>
    </div>
</body>
</html>
